<!-- Navigation. With docs=true it is the compact sticky header of the docs: the search and the button of the menu of a phone are added -->
<nav class="navbar{% if include.docs %} docs-navbar{% endif %}">
    <div class="container topnavlinks">
        <div class="navbar-header">
            <a href="/"><img alt="ka-table" src="{{"images/logo.svg"}}"></a>
        </div>
        {% if include.docs %}
        {% include search.html %}
        {% endif %}
        <div class="topnav-links">
            {% include topnav_links.html %}
        </div>
        {% if include.docs %}
        <button type="button" class="docs-menu-button" aria-label="Menu" aria-controls="tg-sb-sidebar" aria-expanded="false"><span></span></button>
        {% endif %}
    </div>
    <!-- /.container -->
</nav>
